services:
  - type: web
    name: eufisky
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws websockets
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: AGENT_BACKEND
        value: voice_agent
      - key: SENIOR_NAME
        value: Margaret
      - key: FAMILY_NAME
        value: Sarah
      - key: FEATURE_INCIDENT_INSIGHTS
        value: "false"
      - key: FEATURE_GUARDIAN_VOICE_TUNING
        value: "false"
      - key: FEATURE_SPANISH_MONITORING
        value: "false"
      - key: FEATURE_INCIDENT_EXPORT
        value: "false"
      - key: FEATURE_TWILIO_TELEPHONY
        value: "false"
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
